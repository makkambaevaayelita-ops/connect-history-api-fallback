<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С Днём Рождения, Орозгул!</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: #f8f8f8;
      color: #333;
      text-align: center;
    }
    header {
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      color: white;
      padding: 60px 20px;
    }
    header h1 {
      font-size: 2.5em;
      margin: 0;
    }
    header p {
      font-size: 1.2em;
      margin-top: 10px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px 20px;
      max-width: 900px;
      margin: auto;
    }
    .gallery img {
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    footer {
      background: #333;
      color: white;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>С Днём Рождения, Орозгул! 🎂</h1>
    <p>Пусть этот день будет наполнен счастьем, любовью и улыбками!</p>
  </header>

  <section class="gallery">
    <img src="img1.jpg" alt="Орозгул фото 1">
    <img src="img2.jpg" alt="Орозгул фото 2">
  </section>

  <footer>
    <p>С любовью, твои друзья 💌</p>
  </footer>

</body>
</html>
